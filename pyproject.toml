[project]
name = "cloudops-lab"
version = "0.1.0"
description = "Cloud service inventory and monitoring API"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "venv", "instance", "__pycache__"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import sorting, B: common bugs, UP: modern syntax
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
